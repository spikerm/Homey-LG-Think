<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{width:100%;margin:0;padding:0;overflow-x:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{display:grid;gap:10px;width:100%}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.title{font-weight:700;font-size:17px}.status{font-size:12px;opacity:.72;text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:grid;gap:4px;font-size:11px;opacity:.84}select,input{width:100%;border:1px solid rgba(127,127,127,.28);border-radius:9px;padding:8px;background:transparent;color:inherit}.toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.toggle{border:1px solid rgba(127,127,127,.22);border-radius:9px;padding:7px;font-size:11px;display:flex;align-items:center;gap:5px}.toggle input{width:auto}.card{border:1px solid rgba(127,127,127,.20);border-radius:12px;padding:10px}.plan{font-size:13px;line-height:1.45}.price{font-size:20px;font-weight:700}.buttons{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:7px}button{border:0;border-radius:10px;padding:10px 8px;font-weight:650;cursor:pointer}.primary{background:#A50034;color:white}.secondary{background:rgba(127,127,127,.16);color:inherit}.danger{background:rgba(190,30,45,.14);color:inherit}.msg{min-height:18px;font-size:12px;opacity:.8}.hidden{display:none!important}.small{font-size:11px;opacity:.7}.learnNote{margin-top:5px}.progressHead{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px}.progressTrack{height:8px;border-radius:999px;background:rgba(127,127,127,.18);overflow:hidden;margin-top:7px}.progressFill{height:100%;width:0;border-radius:999px;background:currentColor;opacity:.75;transition:width .25s ease}.progressInfo{margin-top:6px;font-size:11px;opacity:.7}button:disabled,.button:disabled,input[type="button"]:disabled,input[type="submit"]:disabled{opacity:.42!important;filter:grayscale(1)!important;cursor:not-allowed!important;box-shadow:none!important}button:disabled:hover,.button:disabled:hover{transform:none!important}
  </style>
</head>
<body class="homey-widget">
<div class="wrap">
  <div class="top">
    <div><div class="title">Slim Wassen</div><div id="deviceName" class="small">LG ThinQ</div></div>
    <div id="machineStatus" class="status">Laden…</div>
  </div>

  <div id="remoteWarning" class="card hidden" style="font-size:12px;border-color:rgba(198,40,40,.45)">⚠ Remote Start is niet actief. Plannen kan wel, maar automatisch starten lukt pas als Remote Start op de wasmachine actief is.</div>

  <div id="liveProgress" class="card hidden">
    <div class="progressHead"><strong>Voortgang</strong><strong id="progressPercent">—</strong></div>
    <div class="progressTrack"><div id="progressFill" class="progressFill"></div></div>
    <div id="progressInfo" class="progressInfo"></div>
  </div>

  <div class="grid">
    <label>Wasprogramma<select id="program"></select></label>
    <label>Temperatuur<select id="temp"></select></label>
    <label>Centrifugeren<select id="spin"></select></label>
    <label>Spoelen<select id="rinse"></select></label>
    <label>Drogen<select id="dryLevel"></select></label>
    <label>Wasintensiteit<select id="soilWash"></select></label>
  </div>

  <div class="toggles">
    <label class="toggle"><input id="preWash" type="checkbox"> Voorwas</label>
    <label class="toggle"><input id="turboWash" type="checkbox"> TurboWash</label>
    <label class="toggle"><input id="steam" type="checkbox"> Stoom</label>
    <label class="toggle"><input id="medicRinse" type="checkbox"> Hygiënisch</label>
    <label class="toggle"><input id="ecoHybrid" type="checkbox"> Eco Hybrid</label>
  </div>

  <div class="card">
    <div class="grid">
      <label>Verwachte duur (min)
        <input id="duration" type="number" min="15" max="600" step="5" value="120">
        <span id="durationLearning" class="small learnNote">Nog aan het leren</span>
      </label>
      <label>Uiterlijk klaar<input id="deadline" type="datetime-local"></label>
    </div>
    <div style="height:8px"></div>
    <button id="calculate" class="secondary" style="width:100%">Zoek goedkoopste tijdvak</button>
  </div>

  <div id="result" class="card plan hidden">
    <div class="small">Goedkoopste planning</div>
    <div><strong id="planTime"></strong></div>
    <div><span id="planPrice" class="price"></span> <span class="small">gemiddeld / kWh</span></div>
    <div id="planInfo" class="small"></div>
  </div>

  <div id="activePlan" class="card plan hidden"></div>

  <div class="buttons">
    <button id="save" class="primary" disabled>Plan wassen</button>
    <button id="start" class="secondary">Nu starten</button>
    <button id="wake" class="secondary">Wakker maken</button>
  </div>
  <button id="cancel" class="danger hidden">Planning annuleren</button>
  <div id="msg" class="msg"></div>
</div>

<script>
function onHomeyReady(Homey){
  const $=id=>document.getElementById(id);
  let deviceId=null,state=null,preview=null,ready=false,heightTimer=null,lastHeight=0;
  const labels={TEMP_COLD:'Koud',TEMP_20:'20 °C',TEMP_30:'30 °C',TEMP_40:'40 °C',TEMP_50:'50 °C',TEMP_60:'60 °C',TEMP_95:'95 °C',NO_TEMP:'Niet geselecteerd',NO_SPIN:'Niet centrifugeren',SPIN_400:'400 rpm',SPIN_600:'600 rpm',SPIN_700:'700 rpm',SPIN_800:'800 rpm',SPIN_900:'900 rpm',SPIN_1000:'1000 rpm',SPIN_1100:'1100 rpm',SPIN_1200:'1200 rpm',SPIN_Max:'Maximum',SPIN_1400:'Maximum',NOT_SELECTED:'Niet geselecteerd',NO_RINSE:'Niet geselecteerd',RINSE_NORMAL:'Normaal',RINSE_PLUS:'Extra',RINSE_PLUSPLUS:'Extra +',RINSE_NORMAL_HOLD:'Normaal + stop',RINSE_PLUS_HOLD:'Extra + stop',NO_DRYLEVEL:'Niet drogen',DRYLEVEL_NORMAL:'Normaal',DRYLEVEL_30:'30 min',DRYLEVEL_60:'60 min',DRYLEVEL_90:'90 min',DRYLEVEL_120:'120 min',DRYLEVEL_150:'150 min',DRYLEVEL_ECO:'Eco',DRYLEVEL_VERY:'Extra droog',DRYLEVEL_IRON:'Strijkdroog',DRYLEVEL_LOW:'Lage temperatuur',NO_SOILWASH:'Niet geselecteerd',SOILWASH_NORMAL:'Normaal',SOILWASH_INTENSIVE:'Intensief',SOILWASH_TIMESAVE:'Tijdbesparing',SOILWASH_TURBO_WASH:'Turbo Wash'};
  const label=v=>labels[v]||String(v||'').replaceAll('_',' ');
  const fmt=ms=>new Intl.DateTimeFormat('nl-NL',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(ms));
  const money=v=>Number.isFinite(Number(v))?'€ '+Number(v).toFixed(4).replace('.',','):'—';
  const activeStatus=d=>['wassen','spoelen','centrifugeren','drogen','running','washing','rinsing','spinning','drying','belading detecteren','detecting','gepauzeerd','pause'].some(x=>String(d?.status||'').toLowerCase().includes(x));
  function msg(t,e=false){$('msg').textContent=t||'';$('msg').style.color=e?'#c62828':''}
  function syncHeight(initial=false){clearTimeout(heightTimer);heightTimer=setTimeout(()=>{const h=Math.max(260,Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height+2));if(!initial&&ready&&Math.abs(h-lastHeight)<2)return;lastHeight=h;try{if(!ready){ready=true;Homey.ready({height:h})}else if(Homey.setHeight)Homey.setHeight(h)}catch(e){}},20)}
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>syncHeight(false)).observe(document.querySelector('.wrap'));

  function currentCourse(){return state?.programs?.find(p=>p.id===$('program').value)}
  function fillSelect(id,values,current){const el=$(id),old=el.value,list=(values||[]).filter(Boolean);el.innerHTML='';if(!list.length){const o=document.createElement('option');o.value='';o.textContent='Niet beschikbaar';el.appendChild(o);el.disabled=true;return}el.disabled=false;for(const v of list){const o=document.createElement('option');o.value=v;o.textContent=label(v);el.appendChild(o)}if(list.includes(old))el.value=old;else if(current&&list.includes(current))el.value=current}
  const optionValues=key=>{const o=currentCourse()?.options?.[key];return o?.selectable?.length?o.selectable:(o?.default?[o.default]:[])};
  const courseDefault=key=>currentCourse()?.options?.[key]?.default||null;
  function refreshOptions(){fillSelect('temp',optionValues('temp'),courseDefault('temp'));fillSelect('spin',optionValues('spin'),courseDefault('spin'));fillSelect('rinse',optionValues('rinse'),courseDefault('rinse'));fillSelect('dryLevel',optionValues('dryLevel'),courseDefault('dryLevel'));fillSelect('soilWash',optionValues('soilWash'),courseDefault('soilWash'));for(const [id,key,on] of [['preWash','preWash','PREWASH_ON'],['turboWash','turboWash','TURBOWASH_ON'],['steam','steam','STEAM_ON'],['medicRinse','medicRinse','MEDICRINSE_ON'],['ecoHybrid','ecoHybrid','ECOHYBRID_ON']]){const opt=currentCourse()?.options?.[key],el=$(id);el.disabled=!opt||(!opt.selectable?.length&&!opt.default);el.checked=opt?.default===on}}
  function expectedDuration(){const c=currentCourse();if(!c)return 120;let m=Number(c.expectedDurationMinutes||120),dry=$('dryLevel').value;const timed={DRYLEVEL_30:30,DRYLEVEL_60:60,DRYLEVEL_90:90,DRYLEVEL_120:120,DRYLEVEL_150:150};if(c.id==='DRYONLY'&&timed[dry])m=timed[dry];if(c.id==='WASHDRY'&&timed[dry])m=90+timed[dry];return Math.max(14,Math.min(600,Math.round(m)))}
  function renderLearning(data=state){const learned=currentCourse()?.durationLearning||data?.learnedDuration;if(learned?.count>0){$('durationLearning').textContent='Geleerd uit '+learned.count+' meting'+(learned.count===1?'':'en')+' · laatste '+Math.round(learned.lastMinutes)+' min'}else $('durationLearning').textContent='Nog aan het leren'}
  function updateExpectedDuration(){ $('duration').value=expectedDuration(); renderLearning(); preview=null;$('save').disabled=true;$('result').classList.add('hidden') }

  function renderProgress(data){const active=activeStatus(data),p=Number(data?.progressPercent),total=Number(data?.totalMinutes),remaining=Number(data?.remainingMinutes);if(active&&Number.isFinite(p)){$('liveProgress').classList.remove('hidden');$('progressPercent').textContent=Math.round(p)+'%';$('progressFill').style.width=Math.max(0,Math.min(100,p))+'%';const bits=[];if(Number.isFinite(total))bits.push('Actuele LG-duur '+Math.round(total)+' min');if(Number.isFinite(remaining))bits.push('nog '+Math.round(remaining)+' min');if(Number.isFinite(Number(data?.planDurationMinutes)))bits.push('planning gebruikte '+Math.round(Number(data.planDurationMinutes))+' min');$('progressInfo').textContent=bits.join(' · ')}else if(String(data?.status||'').toLowerCase().includes('klaar')&&Number.isFinite(Number(data?.actualCycleDuration))){$('liveProgress').classList.remove('hidden');$('progressPercent').textContent='100%';$('progressFill').style.width='100%';$('progressInfo').textContent='Klaar · werkelijke duur '+Math.round(Number(data.actualCycleDuration))+' min'}else{$('liveProgress').classList.add('hidden')}}

  function renderMachineStatus(data){if(!data)return;const active=activeStatus(data),remote=data.remoteControl===true;$('remoteWarning').classList.toggle('hidden',remote);$('calculate').disabled=active;$('start').disabled=active;$('wake').disabled=active;$('save').disabled=active||!preview;const err=data.error&&data.error!=='ERROR_NO'?String(data.error):null;if(err){$('machineStatus').textContent='⚠ Fout · '+err;$('machineStatus').style.color='#c62828'}else{$('machineStatus').style.color='';$('machineStatus').textContent=active&&data.remaining&&data.remaining!=='0:00'?(data.status+' · nog '+data.remaining):(data.status||'Onbekend')+(active?'':(remote?' · Remote ✓':' · Remote ✕'))}renderProgress(data);renderLearning(data);syncHeight(false)}

  function applyMachineSelections(data){if(!data||!activeStatus(data))return;const pid=data.currentProgramId;if(pid&&[...$('program').options].some(o=>o.value===pid)&&$('program').value!==pid){$('program').value=pid;refreshOptions()}const opts=data.liveOptions||{};for(const id of ['temp','spin','rinse','dryLevel','soilWash']){const el=$(id),v=opts[id];if(!el||el.disabled||!v)continue;if(![...el.options].some(o=>o.value===v)){const o=document.createElement('option');o.value=v;o.textContent=label(v);el.appendChild(o)}el.value=v}for(const [id,on] of Object.entries({preWash:'PREWASH_ON',turboWash:'TURBOWASH_ON',steam:'STEAM_ON',medicRinse:'MEDICRINSE_ON',ecoHybrid:'ECOHYBRID_ON'})){const el=$(id);if(el&&!el.disabled&&opts[id])el.checked=opts[id]===on}}
  function applySelectedConfig(selected){if(!selected?.options)return;for(const id of ['temp','spin','rinse','dryLevel','soilWash']){const el=$(id),v=selected.options[id];if(el&&!el.disabled&&v&&[...el.options].some(o=>o.value===v))el.value=v}for(const [id,on] of Object.entries({preWash:'PREWASH_ON',turboWash:'TURBOWASH_ON',steam:'STEAM_ON',medicRinse:'MEDICRINSE_ON',ecoHybrid:'ECOHYBRID_ON'})){const el=$(id),v=selected.options[id];if(el&&!el.disabled&&v)el.checked=v===on}}
  function config(){const options={};for(const id of ['temp','spin','rinse','dryLevel','soilWash']){const el=$(id);if(!el.disabled&&el.value)options[id]=el.value}for(const [id,on,off] of [['preWash','PREWASH_ON','PREWASH_OFF'],['turboWash','TURBOWASH_ON','TURBOWASH_OFF'],['steam','STEAM_ON','STEAM_OFF'],['medicRinse','MEDICRINSE_ON','MEDICRINSE_OFF'],['ecoHybrid','ECOHYBRID_ON','ECOHYBRID_OFF']]){const el=$(id);if(!el.disabled)options[id]=el.checked?on:off}return{programId:$('program').value,options}}
  function planProgramName(plan){const id=plan?.config?.programId;return id?(state?.programs?.find(p=>p.id===id)?.name||label(id)):null}
  function planOptionSummary(plan){const o=plan?.config?.options||{},parts=[];if(o.temp&&!['NO_TEMP','NOT_SELECTED'].includes(o.temp))parts.push(label(o.temp));if(o.spin)parts.push(label(o.spin));if(o.rinse&&!['NO_RINSE','NOT_SELECTED'].includes(o.rinse))parts.push('Spoelen: '+label(o.rinse));if(o.dryLevel&&!['NO_DRYLEVEL','NOT_SELECTED'].includes(o.dryLevel))parts.push('Drogen: '+label(o.dryLevel));if(o.soilWash&&!['NO_SOILWASH','NOT_SELECTED'].includes(o.soilWash))parts.push('Intensiteit: '+label(o.soilWash));const en=[];if(o.preWash==='PREWASH_ON')en.push('Voorwas');if(o.turboWash==='TURBOWASH_ON')en.push('TurboWash');if(o.steam==='STEAM_ON')en.push('Stoom');if(o.medicRinse==='MEDICRINSE_ON')en.push('Hygiënisch');if(o.ecoHybrid==='ECOHYBRID_ON')en.push('Eco Hybrid');if(en.length)parts.push(en.join(', '));return parts.join(' · ')}
  function showPlan(plan){if(!plan||!['scheduled','starting','started','failed'].includes(plan.status)){$('activePlan').classList.add('hidden');$('cancel').classList.add('hidden');return}const names={scheduled:'Gepland',starting:'Wordt gestart',started:'Gestart',failed:'Mislukt'},program=planProgramName(plan),opts=planOptionSummary(plan);$('activePlan').classList.remove('hidden');$('activePlan').innerHTML='<strong>'+names[plan.status]+'</strong><br>'+(program?'<strong>Programma: '+program+'</strong><br>':'')+(opts?'<span class="small">'+opts+'</span><br>':'')+(Number.isFinite(Number(plan.durationMinutes))?'Duur: '+Number(plan.durationMinutes)+' min <span class="small">(planning gebruikt deze duur)</span><br>':'')+(plan.startAt?'Start: '+fmt(plan.startAt)+'<br>':'')+(plan.deadlineAt?'Uiterlijk klaar: '+fmt(plan.deadlineAt)+'<br>':'')+(Number.isFinite(Number(plan.averagePrice))?'Gemiddelde prijs: '+money(plan.averagePrice)+'/kWh<br>':'')+(plan.lastError?'<span style="color:#c62828">'+plan.lastError+'</span>':'');$('cancel').classList.toggle('hidden',plan.status!=='scheduled');syncHeight(false)}

  async function refreshLive(){if(!deviceId)return;try{const live=await Homey.api('GET','/live?deviceId='+encodeURIComponent(deviceId),{});renderMachineStatus(live);applyMachineSelections(live);if(state)Object.assign(state,live)}catch(e){}}
  async function load(){const ids=Homey.getDeviceIds();deviceId=ids&&ids[0];if(!deviceId){msg('Kies eerst een LG-wasmachine in de widgetinstellingen.',true);syncHeight(true);return}try{state=await Homey.api('GET','/state?deviceId='+encodeURIComponent(deviceId),{});$('deviceName').textContent=state.name||'LG ThinQ';$('program').innerHTML='';for(const p of state.programs||[]){const o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('program').appendChild(o)}if(state.selected?.programId&&[...$('program').options].some(o=>o.value===state.selected.programId))$('program').value=state.selected.programId;refreshOptions();applySelectedConfig(state.selected);applyMachineSelections(state);updateExpectedDuration();renderMachineStatus(state);showPlan(state.plan);msg('')}catch(e){msg(e.message||String(e),true)}syncHeight(true)}

  $('program').addEventListener('change',()=>{refreshOptions();updateExpectedDuration();syncHeight(false)});for(const id of ['temp','spin','rinse','soilWash','preWash','turboWash','steam','medicRinse','ecoHybrid','duration','deadline'])$(id).addEventListener('change',()=>{preview=null;$('save').disabled=true;$('result').classList.add('hidden');syncHeight(false)});$('dryLevel').addEventListener('change',()=>{updateExpectedDuration();syncHeight(false)});
  const d=new Date(Date.now()+12*3600000);d.setMinutes(0,0,0);$('deadline').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $('calculate').addEventListener('click',async()=>{if($('calculate').disabled)return;try{msg('Homey Energy-prijzen ophalen…');const deadlineMs=new Date($('deadline').value).getTime(),durationMinutes=Number($('duration').value);preview=await Homey.api('POST','/preview',{deviceId,earliestMs:Date.now(),deadlineMs,durationMinutes});$('result').classList.remove('hidden');$('planTime').textContent=fmt(preview.best.start)+' → '+new Intl.DateTimeFormat('nl-NL',{hour:'2-digit',minute:'2-digit'}).format(new Date(preview.best.end));$('planPrice').textContent=money(preview.best.averagePrice);$('planInfo').textContent=preview.best.durationMinutes+' minuten · '+(preview.slots?.length||0)+' prijspunten bekeken';$('save').disabled=false;msg('Goedkoopste aaneengesloten tijdvak gevonden.');syncHeight(false)}catch(e){msg(e.message||String(e),true)}});
  $('save').addEventListener('click',async()=>{if($('save').disabled||!preview?.best)return;try{const deadlineMs=new Date($('deadline').value).getTime();const plan=await Homey.api('POST','/plan',{deviceId,plan:{startAt:preview.best.start,endAt:preview.best.end,deadlineAt:deadlineMs,durationMinutes:preview.best.durationMinutes,averagePrice:preview.best.averagePrice,config:config()}});if(state)state.plan=plan;showPlan(plan);$('result').classList.add('hidden');$('save').disabled=true;msg(state?.remoteControl===false?'Slim wassen is gepland. ⚠ Remote Start staat nu uit; zet dit vóór de geplande start aan.':'Slim wassen is gepland.');Homey.hapticFeedback?.()}catch(e){msg(e.message||String(e),true)}});
  $('start').addEventListener('click',async()=>{if($('start').disabled)return;$('start').disabled=true;try{msg('Startopdracht naar Homey sturen…');await Homey.api('POST','/start-now',{deviceId,config:config()});msg('Startopdracht geaccepteerd · LG wordt nu gestart…')}catch(e){msg(e.message||String(e),true);$('start').disabled=false}setTimeout(()=>{$('start').disabled=false},12000)});
  $('wake').addEventListener('click',async()=>{if($('wake').disabled)return;try{msg('Wasmachine wakker maken…');await Homey.api('POST','/wake',{deviceId});msg('Wake-up verzonden.')}catch(e){msg(e.message||String(e),true)}});
  $('cancel').addEventListener('click',async()=>{try{const p=await Homey.api('DELETE','/plan?deviceId='+encodeURIComponent(deviceId),{});if(state)state.plan=p;showPlan(p);msg('Planning geannuleerd.')}catch(e){msg(e.message||String(e),true)}});
  Homey.on('smart_wash_plan_changed',data=>{if(!data||String(data.deviceId)!==String(deviceId))return;if(state)state.plan=data.plan;showPlan(data.plan)});
  Homey.on('smart_wash_live_status',data=>{if(!data||String(data.deviceId)!==String(deviceId))return;renderMachineStatus(data);applyMachineSelections(data);if(state)Object.assign(state,data)});
  Homey.on('smart_wash_start_result',data=>{if(!data||String(data.deviceId)!==String(deviceId))return;$('start').disabled=false;msg(data.ok?'Wasmachine gestart.':'Start mislukt: '+(data.message||'onbekende fout'),!data.ok);if(data.ok)setTimeout(load,1500)});
  load();setInterval(refreshLive,5000);
}
</script>
</body>
</html>
